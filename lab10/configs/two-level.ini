# Two levels of cache: an L1 above an L2.
#
# A machine of Lab 10: the small instruction cache of Lab 9, and beside it a
# data cache of the same shape. Loads and stores now go through a cache, which
# the write path makes possible.
#
# Both caches are 128 bytes in 16-byte blocks, small enough that the programs
# evict and write back blocks. A realistic cache would hold a test program's
# working set, and the write path would have no visible effect.
#
# The three configurations of Lab 10 each differ in one respect:
#
#     dcache-writeback.ini     write-back, allocate on a write miss
#     dcache-writethrough.ini  write-through, no allocate: the same machine
#                              with the opposite choice for both policies
#     two-level.ini            write-back, with an L2 below the L1

[Processor]
type = forwarding

[Timing]
latency_overlap = max

[RAM]
latency = 100

[I1_Cache]
valid        = true
latency      = 2
size         = 128
block_size   = 16
assoc        = 1
mapping      = direct
replacement  = FIFO
write_policy = write-back
write_miss   = allocate

[L1_Cache]
valid        = true
latency      = 2
size         = 128
block_size   = 16
assoc        = 1
mapping      = direct
replacement  = FIFO
write_policy = write-back
write_miss   = allocate

[L2_Cache]
valid        = true
latency      = 10
size         = 512
block_size   = 16
assoc        = 4
mapping      = set
replacement  = LRU
write_policy = write-back
write_miss   = allocate
