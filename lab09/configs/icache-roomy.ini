# An instruction cache big enough to hold the whole program.
#
# A machine of Lab 9. Fetches go through a small I1; loads and stores access
# the RAM directly, since a data cache requires the write path of Lab 10. The
# instruction stream is read-only, so a cache that supports only reads is
# sufficient for it.
#
# Not graded. It is 4 KiB, in the same 16-byte blocks as the other four so
# that miss counts are comparable, and larger than any test program, so no
# block is ever evicted and every miss is a first access: a compulsory miss,
# which no geometry or replacement policy can avoid.
#
# It is the lower bound for the other four: the excess of their misses over
# this run's is the cost of their organisation.

[Processor]
type = forwarding

[Timing]
latency_overlap = max

[RAM]
latency = 100

[I1_Cache]
valid        = true
latency      = 2
size         = 4096
block_size   = 16
assoc        = 4
mapping      = set
replacement  = LRU
write_policy = write-back
write_miss   = allocate

# The data cache and the second level are added in Lab 10.
[L1_Cache]
valid = false

[L2_Cache]
valid = false
