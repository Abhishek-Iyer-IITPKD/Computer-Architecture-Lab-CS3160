# One two-way set-associative instruction cache, and no other cache.
#
# A machine of Lab 9. Fetches go through a small I1; loads and stores access
# the RAM directly, since a data cache requires the write path of Lab 10. The
# instruction stream is read-only, so a cache that supports only reads is
# sufficient for it.
#
# The four graded icache-*.ini files arrange the same 128 bytes of storage in
# four ways. Size, block size, latency and machine are otherwise identical, so
# any difference in miss count is due to the mapping and replacement policy
# alone.
#
#     icache-direct.ini     8 sets of 1 way    FIFO (with one way, no choice)
#     icache-2way-lru.ini   4 sets of 2 ways   LRU
#     icache-full-lru.ini   1 set  of 8 ways   LRU
#     icache-full-fifo.ini  1 set  of 8 ways   FIFO
#
# 128 bytes is deliberately far too small for a real machine: eight blocks can
# be traced by hand, and a realistic cache would hold each test program
# entirely, so that every configuration would report the same result.

[Processor]
type = forwarding

[Timing]
latency_overlap = max

[RAM]
latency = 100

[I1_Cache]
valid        = true
latency      = 2
size         = 128
block_size   = 16
assoc        = 2
mapping      = set
replacement  = LRU
write_policy = write-back
write_miss   = allocate

# The data cache and the second level are added in Lab 10.
[L1_Cache]
valid = false

[L2_Cache]
valid = false
